name: Build and Test
on:
  push:
    paths-ignore:
      - 'docs/**'
      - './README.md'
      - './.gitignore'
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  buildandtest:
    name: Build and Scan Image with Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Add CKAN url to hosts
        run: sudo echo "127.0.0.1 ckan-dev" | sudo tee -a /etc/hosts
      - name: Add Minio url to hosts
        run: sudo echo "127.0.0.1 minio" | sudo tee -a /etc/hosts
      - name: Copy .env.example into .env
        run: |
          cp .env.example .env
      - name: Install `Xvfb` and others to run browsers for end-to-end testing in local CI/CD simulations
        if: ${{ env.ACT }}
        run: sudo apt-get update && sudo apt-get install -y xvfb && npx playwright install-deps
      - name: Use public DNS for Docker
        # Containers on the runner use Azure's resolver (168.63.129.16), which
        # currently times out from inside Docker, so apt in image builds cannot
        # resolve mirrors. Public resolvers work.
        run: |
          echo '{"dns":["8.8.8.8","1.1.1.1"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker run --rm ubuntu:jammy getent hosts archive.ubuntu.com
      - name: Set up Docker Containers
        run: |
          docker compose -f docker-compose.dev.yml --env-file .env.example up --build -d
      - name: Create sysadmin API for Authorization
        run: bash ./scripts/cypress_setup.sh
      - name: Print Logs
        run: docker compose -f docker-compose.dev.yml --env-file .env.example logs
        continue-on-error: true
      - name: Wait for ckan-tdc-dev to be healthy
        run: |
          echo "Waiting for ckan-tdc-dev to become healthy"
          for i in {1..60}; do
            health_status=$(docker inspect --format='{{.State.Health.Status}}' ckan-tdc-dev)
            if [ "$health_status" == "healthy" ]; then
              echo "ckan-tdc-dev is healthy"
              break
            elif [ "$health_status" == "unhealthy" ]; then
              echo "ckan-tdc-dev is unhealthy, printing logs"
              docker compose -f docker-compose.dev.yml logs ckan-tdc-dev
              exit 1
            else
              echo "Current health status: $health_status"
            fi
            sleep 5
          done
          if [ "$health_status" != "healthy" ]; then
            echo "ckan-tdc-dev did not become healthy in time"
            docker compose -f docker-compose.dev.yml logs ckan-tdc-dev
            exit 1
          fi
      - name: Wait for ckan-tdc-db to be healthy
        run: |
          while ! docker exec ckan-tdc-db pg_isready -U ckandbuser -d ckandb; do
            sleep 1
          done
      - name: Run seeding geographies
        run: docker exec ckan-tdc-dev sh -c "ckan -c ckan.ini create-default-geographies"
      - name: Copy .env
        run: cp .env.example .env
        working-directory: ./frontend
      - name: Install frontend dependencies and Cypress
        # Only installs; the app is built and started in the steps below so a
        # failure there shows the server's own output instead of an opaque
        # "Socket closed before the connection was established" from the action
        uses: cypress-io/github-action@v6
        with:
          runTests: false
          install-command: npm install
          working-directory: ./frontend
      - name: Build frontend
        run: npm run build
        working-directory: ./frontend
      - name: Start frontend server
        run: |
          nohup npm run start > "$RUNNER_TEMP/frontend-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/frontend-server.pid"
        working-directory: ./frontend
      - name: Wait for frontend server
        run: |
          pid=$(cat "$RUNNER_TEMP/frontend-server.pid")
          for i in $(seq 1 120); do
            # Fail fast with the server log if the process died, instead of
            # waiting out the whole timeout on a port nobody listens on
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Frontend server exited before becoming ready:"
              cat "$RUNNER_TEMP/frontend-server.log"
              exit 1
            fi
            if curl -s -o /dev/null --max-time 5 http://127.0.0.1:3000; then
              echo "Frontend server is up after ~$((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "Frontend server did not respond on port 3000 within 600s:"
          cat "$RUNNER_TEMP/frontend-server.log"
          exit 1
      - name: Run frontend tests 🧪
        uses: cypress-io/github-action@v6
        with:
          install: false
          command: npm run test
          working-directory: ./frontend
      - name: Print frontend server log
        if: failure()
        run: cat "$RUNNER_TEMP/frontend-server.log" || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: /home/runner/work/ckan-docker-tdc-dev/ckan-docker-tdc-dev/integration-tests/cypress/screenshots
          if-no-files-found: ignore
      - name: Print Error Logs
        if: failure()
        run: docker compose -f docker-compose.dev.yml --env-file .env.example logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Frontend screenshots
          path: ./frontend/cypress/screenshots
          if-no-files-found: ignore
      - name: Tear down containers
        if: failure() || success()
        run: docker compose -f docker-compose.dev.yml --env-file .env.example down -v --remove-orphans
